global:
  # 5s 간격은 demo 환경에서 alert 반응성을 빠르게 보기 위한 선택.
  # 실서비스에선 15s가 일반적 — scrape/eval 비용과 신호 지연의 trade-off.
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

# Alertmanager는 본 과제 범위 밖. 알림 전달이 필요하면 아래 섹션을 활성화:
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: courses-api
